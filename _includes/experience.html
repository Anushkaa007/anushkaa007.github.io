{% for e in site.data.experience %}
<div class="row">
<div class="when">{{ e.when }}</div>
<div class="what">
<strong>{{ e.role }}</strong><br>
<span class="meta">{{ e.org }}</span>
{% if e.text %}<p class="lead">{{ e.text }}</p>{% endif %}
{% if e.bullets %}<ul class="bullets">{% for b in e.bullets %}<li>{{ b }}</li>{% endfor %}</ul>{% endif %}
</div>
</div>
{% endfor %}
