- "Your brain has roughly 86 billion neurons, each connecting to thousands of others."
- "Sleep spindles are brief bursts of roughly 11 to 16 Hz activity in the EEG, and they are linked to memory consolidation during sleep."
- "Before the eyes ever see light, the developing retina fires spontaneous waves of activity that help wire the visual system."
- "Hippocampal theta oscillations, at roughly 4 to 8 Hz, are linked to memory and navigation."
- "Memory consolidation, the process that stabilizes new memories, relies heavily on sleep."