- text: "As a rat runs through a place field, its place cell fires earlier and earlier in each theta cycle, so position is written into the timing of spikes within a roughly 8 Hz rhythm, not only into which cell is active."
  source: "O'Keefe & Recce, Hippocampus, 1993"
- text: "The hippocampus also contains time cells: during an empty delay with no movement and no changing cue, different neurons fire at successive moments, giving memory a built-in timeline."
  source: "MacDonald et al., Neuron, 2011"
- text: "During sleep, the hippocampus replays sequences from the day's experience far faster than they originally happened, packed inside brief 150 to 250 Hz ripples."
  source: "Lee & Wilson, Neuron, 2002"
- text: "Memories that look erased by amnesia can sometimes be brought back by re-activating the engram cells with light, which suggests that some forgetting is a failure of retrieval rather than a loss of the stored memory."
  source: "Ryan et al., Science, 2015"
- text: "In immature neurons, GABA, the brain's main inhibitory transmitter, can excite instead of inhibit, because the cells hold more chloride inside. The effect flips as the chloride transporter KCC2 matures."
  source: "Ben-Ari, Nature Reviews Neuroscience, 2002"
- text: "Spindles do not arrive evenly in non-REM sleep. In mice, spindle-band power rises and falls on an infraslow cycle of about 50 seconds, which groups spindles into clusters."
  source: "Lecci et al., Science Advances, 2017"
- text: "In Alzheimer's disease, silent epileptiform spikes with no visible seizure turn up in a substantial fraction of patients, most often during sleep."
  source: "Vossel et al., Annals of Neurology, 2016"
- text: "Long before the eyes can see, the developing retina generates waves of spontaneous activity that sweep across it and help organize the brain's visual maps."
  source: "Meister et al., Science, 1991"
- text: "Selectively disrupting hippocampal ripples during sleep after learning impairs spatial memory in rats, which shows that ripples are causal for consolidation, not just a correlate."
  source: "Girardeau et al., Nature Neuroscience, 2009"